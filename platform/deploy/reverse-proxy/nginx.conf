# YOU HEAL Clinical — nginx reverse proxy (TLS termination with a CA-issued certificate).
# Install as /etc/nginx/conf.d/youheal.conf (it is included in the `http {}` context; the log_format and
# limit_*_zone directives below must stay at that level). Debian/Ubuntu: sites-available + symlink.
# Requires nginx >= 1.25.1 for the "http2 on;" directive (older: use "listen 443 ssl http2;").
#
# Backend configuration (deploy/linux/install.sh):
#   sudo ./install.sh --host 127.0.0.1 --trust-proxy --public-origin https://clinic.example.org
# which sets in /etc/youheal/youheal.env:
#   YH_HOST=127.0.0.1                 backend reachable only via this proxy (forced by --trust-proxy)
#   YH_TRUST_PROXY=1                  one trusted hop: client IP = right-most X-Forwarded-For entry
#   YH_TRUSTED_PROXIES                (default: loopback) only these peers may set X-Forwarded-*; set it
#                                     (install.sh --trusted-proxies) if nginx runs on another host
#   YH_PUBLIC_ORIGIN=https://clinic.example.org   Origin/Referer check on state-changing requests
#   YH_ALLOWED_HOSTS                  must include clinic.example.org (install.sh adds the --public-origin host)
#
# Cookies: under TLS the session cookie is `__Host-yh_sid` (Secure, Path=/, no Domain). Do NOT add
# proxy_cookie_path / proxy_cookie_domain / proxy_cookie_flags rewrites — browsers reject a __Host-
# cookie whose path/domain was altered, and users could not stay signed in.
#
# Backend TLS stays on (defense in depth). Copy the backend's PUBLIC certificate once (and after renewal),
# reading it AS THE SERVICE ACCOUNT so a planted symlink in its data dir cannot make root copy another file:
#   sudo -u youheal cat /var/lib/youheal/tls/cert.pem | sudo tee /etc/nginx/youheal-backend.crt >/dev/null

# --- http-level definitions ---------------------------------------------------------------------------
# Access log WITHOUT query strings ($uri, not $request) and without Referer: queries may carry search
# terms (the app moved patient search to POST /api/v1/patients/search, but treat any query as sensitive).
log_format youheal_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

# Brute-force / resource-exhaustion limits (the app also rate-limits per IP and caps connections with
# YH_MAX_CONNECTIONS; these stop floods before they reach Node).
limit_req_zone  $binary_remote_addr zone=yh_auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=yh_api:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=yh_conn:10m;

upstream youheal_backend {
    server 127.0.0.1:8443;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name clinic.example.org;
    server_tokens off;
    access_log /var/log/nginx/youheal.access.log youheal_noquery;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clinic.example.org;
    server_tokens off;

    # --- TLS (Mozilla "intermediate": TLS 1.2 + 1.3, AEAD-only suites) ---------------------------
    ssl_certificate     /etc/ssl/youheal/fullchain.pem;
    ssl_certificate_key /etc/ssl/youheal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:YouHealTLS:10m;
    ssl_session_tickets off;
    # OCSP stapling: enable only for certificates from a public CA reachable from this host.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/ssl/youheal/chain.pem;

    # --- Limits -----------------------------------------------------------------------------------
    # 5 MB: report images are <= 2 MB each as base64 JSON (server enforces 4 MB for that route, 1 MB elsewhere).
    client_max_body_size 5m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_conn yh_conn 50;
    limit_conn_status 429;
    limit_req_status 429;

    # --- Headers ----------------------------------------------------------------------------------
    # The app sets CSP, nosniff, Referrer-Policy, COOP, X-Frame-Options and (behind TLS) HSTS itself.
    # Replace HSTS here so exactly one, proxy-controlled value is sent. Add "; preload" only after
    # reading https://hstspreload.org — it is hard to undo.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # No compression of API responses: they carry CSRF tokens next to user-reflected data (BREACH).
    gzip off;

    # --- Proxying (inherited by every location below) ------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Verify the backend certificate (self-signed, SAN includes "localhost").
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/youheal-backend.crt;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse on;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
    # Do not let intermediaries cache authenticated responses.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # --- First-run setup is never exposed through the proxy. `^~` is a PREFIX match on the normalized
    #     URI, so /api/v1/setup/, /api/v1/setup/status, //api/v1/setup and %-encoded variants are all
    #     covered (F-04). The app additionally refuses setup when forwarding headers are present and
    #     requires a one-time setup token.
    # The SPA calls GET /api/v1/setup/status at boot (public, read-only) — that one is allowed.
    location = /api/v1/setup/status {
        limit_except GET HEAD { deny all; }
        proxy_pass https://youheal_backend;
    }
    location ^~ /api/v1/setup {
        return 403;
    }

    # Authentication endpoints: 10 requests/minute per client IP, small burst.
    location ^~ /api/v1/auth/ {
        limit_req zone=yh_auth burst=10 nodelay;
        proxy_pass https://youheal_backend;
    }

    location /api/ {
        limit_req zone=yh_api burst=100 nodelay;
        proxy_pass https://youheal_backend;
    }

    location / {
        proxy_pass https://youheal_backend;
    }

    # Access logs: no query strings, no bodies, no Referer. Still security records (AU-9): restrict to
    # root/adm and rotate.
    access_log /var/log/nginx/youheal.access.log youheal_noquery;
    # Note: nginx error-log entries can quote the full request line (incl. query); keep level "error"
    # and protect/rotate this file like the access log.
    error_log  /var/log/nginx/youheal.error.log error;
}
