# YOU HEAL Clinical — nginx reverse proxy (TLS termination with a CA-issued certificate).
# Install as /etc/nginx/conf.d/youheal.conf (Debian/Ubuntu: /etc/nginx/sites-available + symlink).
# Requires nginx >= 1.25.1 for the "http2 on;" directive (older: use "listen 443 ssl http2;").
#
# Backend configuration (deploy/linux/install.sh):
#   sudo ./install.sh --host 127.0.0.1 --trust-proxy --public-origin https://clinic.example.org
# which sets in /etc/youheal/youheal.env:
#   YH_HOST=127.0.0.1                 backend reachable only via this proxy
#   YH_TRUST_PROXY=1                  exactly ONE trusted hop: the server takes the client IP from the
#                                     right-most X-Forwarded-For entry (the one nginx appends), and the
#                                     scheme/host from X-Forwarded-Proto / X-Forwarded-Host
#   YH_PUBLIC_ORIGIN=https://clinic.example.org   used for the Origin/Referer check on state-changing requests
# Never set YH_TRUST_PROXY when clients can reach the backend directly: they could spoof their IP
# (defeating per-IP rate limiting, the audit trail's IP field and the loopback-only setup guard).
#
# Backend TLS stays on (defense in depth). nginx verifies the backend's self-signed certificate,
# which it cannot read from the 0700 data dir, so copy the PUBLIC certificate once (and after renewal):
#   sudo install -m 0644 /var/lib/youheal/tls/cert.pem /etc/nginx/youheal-backend.crt

upstream youheal_backend {
    server 127.0.0.1:8443;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name clinic.example.org;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clinic.example.org;
    server_tokens off;

    # --- TLS (Mozilla "intermediate": TLS 1.2 + 1.3, AEAD-only suites) ---------------------------
    ssl_certificate     /etc/ssl/youheal/fullchain.pem;
    ssl_certificate_key /etc/ssl/youheal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:YouHealTLS:10m;
    ssl_session_tickets off;
    # OCSP stapling: enable only for certificates from a public CA reachable from this host.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/ssl/youheal/chain.pem;

    # --- Limits -----------------------------------------------------------------------------------
    # 5 MB: report images are <= 2 MB each as base64 JSON (server enforces 4 MB for that route, 1 MB elsewhere).
    client_max_body_size 5m;
    client_body_timeout 30s;
    send_timeout 60s;

    # --- Headers ----------------------------------------------------------------------------------
    # The app sets CSP, nosniff, Referrer-Policy, COOP, X-Frame-Options and (behind TLS) HSTS itself.
    # Replace HSTS here so exactly one, proxy-controlled value is sent. Add "; preload" only after
    # reading https://hstspreload.org — it is hard to undo.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # No compression of API responses: they carry CSRF tokens next to user-reflected data (BREACH).
    gzip off;

    # --- First-run setup is never exposed through the proxy (defense in depth; the app also refuses it
    #     for non-loopback clients). Run setup on the host or via `npm run create-admin`.
    location = /api/v1/setup {
        return 403;
    }

    location / {
        proxy_pass https://youheal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Verify the backend certificate (self-signed, SAN includes "localhost").
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/youheal-backend.crt;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse on;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        # Do not let intermediaries cache authenticated responses.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Access logs: nginx logs URLs, never bodies. API paths carry opaque ids only (no PHI in URLs),
    # but treat these logs as security records (AU-9): restrict to root/adm and rotate.
    access_log /var/log/nginx/youheal.access.log;
    error_log  /var/log/nginx/youheal.error.log warn;
}
